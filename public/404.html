<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Delta Laras Wisata (Dallas Tour & Travel)</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment
      var pathSegmentsToKeep = 1; // 1 segment for repository: /dallas-travel/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') +
        l.search.slice(1).replace(/&/g, '~and~') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #FBF9F5;
        color: #0E2A47;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .btn {
        margin-top: 20px;
        padding: 12px 24px;
        background-color: #0E2A47;
        color: #FFFFFF;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>Memuat Halaman Dallas Tour & Travel...</h2>
    <p>Jika halaman tidak otomatis dialihkan dalam beberapa detik, silakan klik tombol di bawah:</p>
    <a href="/dallas-travel/" class="btn">Menuju Beranda Dallas Tour & Travel</a>
  </body>
</html>
